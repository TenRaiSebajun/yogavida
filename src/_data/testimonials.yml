- text: "A calming influence who is a pleasure to learn from. Shannel is the loveliest yoga teacher and one of the nicest people you will meet. I would not hesitate to recommend her."
  author: "Julie"

- text: "Such a lovely experience. A complete novice but felt very comfortable and it was such a calming and relaxing experience. Would highly recommend."
  author: "Alex"

- text: "Loving the Thursday class. First yoga class I\u2019ve done in years and you were so welcoming. Love the structure of the class with the meditation \u2014 the whole experience is wonderful."
  author: "Charlotte"

- text: "A wonderful teacher. The sessions are a perfect combination of physical postures, breathing exercises and relaxation. A real highlight of my week."
  author: "Katya"

- text: "I was so nervous about starting yoga but Shannel made me feel at ease immediately. She really takes the time to make sure everyone is comfortable."
  author: "Jayne"

- text: "The meditation sessions are incredible. I have been sleeping so much better since starting and feel so much calmer throughout the day."
  author: "Jenny"

- text: "Shannel is amazing. She has such a warm, gentle presence and her classes are the perfect balance of challenge and relaxation. I always leave feeling centred."
  author: "Fran"

- text: "I started doing yoga with Shannel during lockdown online and it was a lifeline. She has a real gift for making you feel calm and supported."
  author: "Kay"

- text: "The best yoga classes I have ever attended. Shannel has a beautiful way of guiding you through each pose and creating a peaceful atmosphere."
  author: "Ruth"

- text: "Brilliant teacher who really listens to your needs. The private sessions have helped enormously with my back issues."
  author: "Debbie"

- text: "Shannel\u2019s warmth and knowledge shine through in every class. She makes yoga accessible for everyone regardless of ability."
  author: "Simone"

- text: "An absolutely wonderful teacher. Patient, kind and incredibly knowledgeable. Her classes are the highlight of my week."
  author: "Kris"
